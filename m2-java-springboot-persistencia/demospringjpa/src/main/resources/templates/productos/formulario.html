<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${producto.id == null ? 'Nuevo producto' : 'Editar producto'}">Nuevo producto</title>
    <link rel="stylesheet" th:href="@{/css/productos.css}">
</head>
<body>
<main class="page page-form">
<a class="back-link" th:href="@{/productos}">&larr; Volver al catálogo</a>
<header class="page-header">
    <div>
        <p class="eyebrow">Gestión de productos</p>
        <h1 th:text="${producto.id == null ? 'Agregar producto' : 'Editar producto'}">Agregar producto</h1>
        <p class="subtitle">Completa los datos del producto y guarda los cambios.</p>
    </div>
</header>
<form class="card product-form" th:action="${producto.id == null} ? @{/productos} : @{/productos/{id}(id=${producto.id})}"
      th:object="${producto}" method="post">
    <p class="form-note">Los campos marcados con * son obligatorios.</p>
    <div class="form-grid">
        <div class="field">
            <label for="nombre">Nombre <span aria-hidden="true">*</span></label>
            <input id="nombre" type="text" th:field="*{nombre}" placeholder="Nombre del producto" required>
        </div>
        <div class="field">
            <label for="precio">Precio <span aria-hidden="true">*</span></label>
            <input id="precio" type="number" step="0.01" th:field="*{precio}" required>
        </div>
    </div>
    <div class="field">
        <label for="descripcion">Descripción <span class="optional">(opcional)</span></label>
        <textarea id="descripcion" rows="5" th:field="*{descripcion}" placeholder="Detalles y características del producto"></textarea>
    </div>
    <div class="form-actions">
        <a class="button button-secondary" th:href="@{/productos}">Cancelar</a>
        <button class="button button-primary" type="submit">Guardar</button>
    </div>
</form>
</main>
</body>
</html>
