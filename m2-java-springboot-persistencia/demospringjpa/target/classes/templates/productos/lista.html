<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Productos</title>
    <link rel="stylesheet" th:href="@{/css/productos.css}">
</head>
<body>
<main class="page">
<header class="page-header">
    <div>
        <p class="eyebrow">Gestión de productos</p>
        <h1>Productos</h1>
        <p class="subtitle">Consulta y administra tu catálogo desde un solo lugar.</p>
    </div>
    <a class="button button-primary" th:href="@{/productos/nuevo}">Agregar producto</a>
</header>
<section class="card" aria-label="Listado de productos">
<div class="card-header">
    <h2>Catálogo</h2>
    <span class="badge" th:text="${#lists.size(productos)} + ' productos'">0 productos</span>
</div>
<div class="table-wrapper">
<table>
    <caption class="visually-hidden">Productos registrados y acciones disponibles</caption>
    <thead>
    <tr><th scope="col">Nombre</th><th scope="col" class="price">Precio</th><th scope="col">Descripción</th><th scope="col">Acciones</th></tr>
    </thead>
    <tbody>
    <tr th:each="producto : ${productos}">
        <td class="product-name" th:text="${producto.nombre}"></td>
        <td class="price" th:text="${producto.precio}"></td>
        <td class="description" th:text="${producto.descripcion}"></td>
        <td>
            <div class="row-actions">
            <a class="button button-secondary button-small" th:href="@{/productos/{id}/editar(id=${producto.id})}">Editar</a>
            <form th:action="@{/productos/{id}/eliminar(id=${producto.id})}" method="post"
                  onsubmit="return confirm('¿Desea eliminar este producto?');">
                <button class="button button-danger button-small" type="submit">Eliminar</button>
            </form>
            </div>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(productos)}">
        <td colspan="4" class="empty-state">
            <strong>Aún no hay productos</strong>
            <p>Agrega tu primer producto para comenzar a organizar el catálogo.</p>
        </td>
    </tr>
    </tbody>
</table>
</div>
</section>
</main>
</body>
</html>
